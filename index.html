<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Star Movements Sound | Event Song Requests</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #2a220d 0%, #111 35%, #050505 75%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .brand {
      color: #d9ad3a;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 38px;
      line-height: 1.05;
      margin-bottom: 10px;
    }

    .gold {
      color: #e5b83d;
    }

    .subtitle {
      color: #bdbdbd;
      font-size: 17px;
      line-height: 1.5;
      margin: 20px 0 32px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(229,184,61,0.35);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.35);
    }

    .music-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .card h2 {
      color: #e5b83d;
      font-size: 23px;
      margin-bottom: 12px;
    }

    .card p {
      color: #d0d0d0;
      line-height: 1.6;
      font-size: 15px;
    }

    footer {
      margin-top: 30px;
      color: #777;
      font-size: 12px;
      line-height: 1.7;
    }

    footer strong {
      color: #aaa;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">DJ SERVICE</div>

    <h1>
      STAR MOVEMENTS<br>
      <span class="gold">SOUND</span>
    </h1>

    <p class="subtitle">
      Private event song requests powered by
      Star Movements Sound.
    </p>

    <section class="card">

      <div class="music-icon">🎵</div>

      <h2>Event Song Requests</h2>

      <p>
        Scan the official QR code provided at your event
        to access your private event request page.
      </p>

    </section>

    <footer>
      Music • Entertainment • Good Vibes<br>
      <strong>Star Movements Sound</strong>
    </footer>

  </main>

</body>
</html>
